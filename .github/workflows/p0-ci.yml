name: P0 CI

on:
  push:
    branches:
      - prototype/p0-carry-recompose
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
